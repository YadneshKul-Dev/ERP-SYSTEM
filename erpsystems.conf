<VirtualHost *:80>
    ServerName erpsystem.local
    ServerAdmin admin@example.com

    DocumentRoot /var/www/html/erpsystems/app

    <Directory /var/www/html/erpsystems/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/erpsystem_error.log
    CustomLog ${APACHE_LOG_DIR}/erpsystem_access.log combined
</VirtualHost>
